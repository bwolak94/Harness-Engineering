name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Eval golden set
        run: pnpm eval --json
        # Blocks merge when any golden case fails or a snapshot drifts.
        # Uses --json for CI-friendly output (no color codes, parseable exit code).

      - name: Build
        run: pnpm build

  # E2E tests run in a separate job that requires a running stack.
  # They are gated on the main CI job passing and only run on pull requests
  # to main to avoid burning time on every feature branch push.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @harness/web exec playwright install chromium --with-deps
      - name: Start backend
        run: pnpm --filter @harness/server start &
        env:
          DATABASE_URL: postgresql://harness:harness@localhost:5432/harness
          LLM_API_KEY: test-key
          JWT_SECRET: change-me-in-production-at-least-32-chars
          NODE_ENV: test
      - name: Start frontend
        run: pnpm --filter @harness/web preview --port 5173 &
      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:3000/workflows --timeout 30000
      - name: Run E2E tests
        run: pnpm --filter @harness/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_API_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
