global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape OTel Collector's Prometheus exporter — all harness.* metrics land here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
    metric_relabel_configs:
      # Drop the otelcol_* internal metrics to reduce noise.
      - source_labels: [__name__]
        regex: otelcol_.*
        action: drop

  # Prometheus scrapes itself for meta-metrics (series count, etc.).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
